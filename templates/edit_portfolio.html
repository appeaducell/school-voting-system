{% extends "layout.html" %}

{% block content %}

<div class="card p-4 shadow">

    <h3>Edit Portfolio</h3>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ portfolio[1] }}"
               class="form-control mb-3"
               required>

        <button class="btn btn-success">

            Save Changes

        </button>

        <a href="/dashboard?section=portfolios"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
