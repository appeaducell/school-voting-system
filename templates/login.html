{% extends "layout.html" %}

{% block content %}

<h3 class="mb-3">Student Login</h3>

<form method="post" action="/student">
    <input class="form-control mb-2" name="student_id" placeholder="Enter Student ID" required>
    <button class="btn btn-primary btn-main">Vote</button>
</form>

<hr>

<h3 class="mt-4">Admin Login</h3>


<form method="POST" action="/admin_login">

    <input type="text"
           name="username"
           class="form-control mb-3"
           placeholder="Admin Username"
           required>

    <input type="password"
           name="password"
           class="form-control mb-3"
           placeholder="Password"
           required>

    <button class="btn btn-dark w-100">
        Admin Login
    </button>

</form>

{% endblock %}
