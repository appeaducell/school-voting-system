<!DOCTYPE html>
<html>
<head>

<title>Voter Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
body{
    padding:30px;
}
</style>

</head>

<body onload="window.print()">

<h2 class="text-center mb-4">
    Voter Register
</h2>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>#</th>
            <th>Student ID</th>
            <th>Name</th>
            <th>House</th>
            <th>Voted</th>
        </tr>
    </thead>

    <tbody>

    {% for s in students %}
    <tr>

        <td>{{ loop.index }}</td>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[3] if s[3] else "-" }}</td>

        <td>
            {% if s[2] == 1 %}
                YES
            {% else %}
                NO
            {% endif %}
        </td>

    </tr>
    {% endfor %}

    </tbody>

</table>

</body>
</html>
