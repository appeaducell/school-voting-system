<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>
    {{ school_name }} Voting System
</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

    body{
        background-color:#b1b3b6;
    }

    /* =========================
       HEADER
    ========================= */

    .header{

        position:relative;

        background-image:url("/static/uploads/header_bg.jpg");

        background-size:cover;

        background-position:center;

        background-repeat:no-repeat;

        min-height:300px;

        padding:30px 20px;

        text-align:center;

        color:white;

        overflow:hidden;
    }

    .header::before{

        content:"";

        position:absolute;

        top:0;
        left:0;

        width:100%;
        height:100%;

        background:rgba(0,0,0,0.50);

        z-index:1;
    }

    .header-content{

        position:relative;

        z-index:2;
    }

    .header img{

        width:120px;

        height:120px;

        object-fit:contain;

        border-radius:50%;

        background:white;

        padding:5px;

        margin-bottom:10px;
    }

    .school-name{

        font-size:2rem;

        font-weight:bold;

        text-shadow:2px 2px 5px #000;
    }

    .countdown-title{

        margin-top:10px;

        font-weight:bold;
    }

    #countdown{

        font-size:1.5rem;

        font-weight:bold;

        color:#ff4d4d;

        text-shadow:1px 1px 2px #000;
    }

    /* =========================
       MAIN CONTENT
    ========================= */

    .container-box{

        background:white;

        padding:25px;

        margin-top:15px;

        border-radius:10px;

        box-shadow:0 0 15px rgba(0,0,0,0.15);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer{

        text-align:center;

        margin-top:20px;

        color:#555;

        padding:10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px){

        .school-name{

            font-size:1.3rem;
        }

        .header{

            min-height:250px;
        }

        .header img{

            width:90px;

            height:90px;
        }

        #countdown{

            font-size:1.1rem;
        }
    }

    /* =========================
       PRINT
    ========================= */

    @media print {

        .btn,
        .footer,
        nav,
        .sidebar{
            display:none !important;
        }

        body{
            background:white;
        }

        .card{
            break-inside:avoid;
        }

        canvas{
            max-width:100% !important;
            page-break-inside:avoid;
        }

        .alert{
            border:2px solid #000;
        }
    }

</style>


</head>

<body>

<!-- HEADER -->

<div class="header">


<div class="header-content">

    {% if logo %}

    <img src="{{ url_for('static',
        filename='uploads/' + logo) }}">

    {% endif %}

    <marquee behavior="scroll"
             direction="left"
             scrollamount="6">

        <h1 class="school-name">

            {{ school_name }}

        </h1>

    </marquee>

    <div class="countdown-title">

        ⏳ Voting Ends In

    </div>

    <div id="countdown"></div>

</div>


</div>

<!-- MAIN CONTENT -->

<div class="container">


<div class="container-box">

    {% with messages =
        get_flashed_messages() %}

        {% if messages %}

        <div class="alert alert-success">

            {{ messages[0] }}

        </div>

        {% endif %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</div>


</div>

<!-- FOOTER -->

<div class="footer">


<p>

    &copy; {{ election_year }}
    {{ school_name }}

</p>


</div>

<script>

let electionEnd = "{{ end_time }}";

if (
    electionEnd &&
    document.getElementById(
        "countdown"
    )
){

    let end =
        new Date(
            electionEnd
        ).getTime();

    let timer =
        setInterval(function(){

        let now =
            new Date().getTime();

        let distance =
            end - now;

        if(distance < 0){

            clearInterval(timer);

            document.getElementById(
                "countdown"
            ).innerHTML =
                "⛔ Voting Closed";

            return;
        }

        let days =
            Math.floor(
                distance /
                (1000*60*60*24)
            );

        let hours =
            Math.floor(
                (
                    distance %
                    (
                        1000*60*60*24
                    )
                ) /
                (
                    1000*60*60
                )
            );

        let minutes =
            Math.floor(
                (
                    distance %
                    (
                        1000*60*60
                    )
                ) /
                (
                    1000*60
                )
            );

        let seconds =
            Math.floor(
                (
                    distance %
                    (
                        1000*60
                    )
                ) /
                1000
            );

        document.getElementById(
            "countdown"
        ).innerHTML =

            days + "d " +
            hours + "h " +
            minutes + "m " +
            seconds + "s";

    },1000);
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
