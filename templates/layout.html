<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ school_name }} Voting System</title>

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #b1b3b6;
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header img {
            border-radius: 40px;
        }

        .container-box {
            background: rgb(236, 234, 234);
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        @media print {

    .btn,
    .footer,
    nav,
    .sidebar {
        display: none !important;
    }

    body {
        background: white;
    }

    .card {
        break-inside: avoid;
    }

    canvas {
        max-width: 100% !important;
        page-break-inside: avoid;
    }

    .alert {
        border: 2px solid #000;
    }
}
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    {% if logo %}
<img src="{{ url_for('static', filename='uploads/' + logo) }}"
     style="
        width:200px;
        height:200px;
        object-fit:contain;
     "
     class="mb-1">

    {% endif %}

<marquee behavior="scroll"
         direction="left"
         scrollamount="6">

    <h1 style="display:inline-block; margin:0;">
        {{ school_name }}
    </h1>

</marquee>

    <p>Prefectorial Elections {{ election_year }}</p>

    <div class="text-center mt-2">

    <h5>
        ⏳ Voting Ends In
    </h5>

    <h4 id="countdown"
        style="font-weight:bold; color:rgb(238, 15, 15);">
    </h4>

</div>

</div>

<!-- MAIN CONTENT -->
<div class="container">

    <div class="container-box">

        <!-- SUCCESS / ERROR MESSAGES -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-success">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <!-- PAGE CONTENT -->
        {% block content %}
        {% endblock %}

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <p>&copy; {{ election_year }} {{ school_name }}</p>
</div>

<script>

let electionEnd = "{{ end_time }}";

if (electionEnd && document.getElementById("countdown")) {

    let end = new Date(electionEnd).getTime();

    let timer = setInterval(function () {

        let now = new Date().getTime();

        let distance = end - now;

        if (distance < 0) {

            clearInterval(timer);

            document.getElementById("countdown").innerHTML =
                "⛔ Voting Closed";

            return;
        }

        let days = Math.floor(
            distance / (1000 * 60 * 60 * 24)
        );

        let hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24))
            / (1000 * 60 * 60)
        );

        let minutes = Math.floor(
            (distance % (1000 * 60 * 60))
            / (1000 * 60)
        );

        let seconds = Math.floor(
            (distance % (1000 * 60))
            / 1000
        );

        document.getElementById("countdown").innerHTML =
            days + "d "
            + hours + "h "
            + minutes + "m "
            + seconds + "s ";

    }, 1000);
}

</script>
</body>
</html>
