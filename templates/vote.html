{% extends "layout.html" %}
{% block content %}

<h3 class="mb-4 text-center">
    🗳 Cast Your Vote
</h3>

<form method="post" id="voteForm">

{% for portfolio, pdata in data.items() %}

<div class="portfolio-section card p-4 mb-4"
     id="portfolio{{ pdata.id }}"
     {% if not loop.first %}style="display:none;"{% endif %}>

    <h4 class="text-primary mb-4 text-center">
        {{ portfolio }}
    </h4>

    <div class="row justify-content-center">

    {% for c in pdata.candidates %}

    <div class="col-md-3 text-center mb-3">

        <label style="cursor:pointer; width:100%;">

            <input type="radio"
                   name="{{ pdata.id }}"
                   value="{{ c[0] }}"
                   required
                   data-name="{{ c[1] }}"
                   style="display:none;"
                   onchange="nextPortfolio('{{ pdata.id }}')">

            <div class="candidate-card p-3 border rounded shadow-sm">

                <div style="
                    width:140px;
                    height:140px;
                    margin:auto;
                    overflow:hidden;
                    border-radius:12px;
                    border:1px solid #ccc;
                    background:#f8f9fa;
                ">

                    {% if c[3] %}
                    <img src="{{ url_for('static', filename='uploads/' + c[3]) }}"
                         style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                         ">
                    {% endif %}

                </div>

                <div class="mt-3">
                    <strong>{{ c[1] }}</strong>
                </div>

            </div>

        </label>

    </div>

    {% endfor %}

    </div>

</div>

{% endfor %}

<div id="submitSection"
     class="text-center"
     style="display:none;">

    <button type="button"
            class="btn btn-warning btn-lg"
            onclick="previewVotes()">

        👀 Preview Votes
    </button>

</div>

</form>

<!-- PREVIEW MODAL -->
<div class="modal fade"
     id="previewModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    ✅ Confirm Your Votes
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div id="previewContent"></div>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Go Back
                </button>

                <button type="submit"
                        form="voteForm"
                        class="btn btn-success">

                    ✅ Final Submit
                </button>

            </div>

        </div>

    </div>

</div>

<style>

input[type="radio"]:checked + .candidate-card{
    border:3px solid #198754 !important;
    background:#d1e7dd;
    transform:scale(1.02);
    transition:0.2s;
}

.candidate-card{
    transition:0.2s;
}

</style>



<script>

let portfolios = document.querySelectorAll('.portfolio-section');

function nextPortfolio(currentId){

    let current = document.getElementById(
        "portfolio" + currentId
    );

    current.style.display = "none";

    let portfolioArray = Array.from(portfolios);

    let currentIndex = portfolioArray.indexOf(current);

    if(currentIndex + 1 < portfolioArray.length){

        let next = portfolioArray[currentIndex + 1];

        next.style.display = "block";

        next.scrollIntoView({
            behavior:"smooth"
        });

    } else {

        document.getElementById(
            "submitSection"
        ).style.display = "block";

        document.getElementById(
            "submitSection"
        ).scrollIntoView({
            behavior:"smooth"
        });

    }
}
</script>

<script>

function previewVotes(){

    let preview = "";

    portfolios.forEach(section => {

        let title =
            section.querySelector("h4").innerText;

        let selected =
            section.querySelector(
                "input[type='radio']:checked"
            );

        if(selected){

            let candidate =
                selected.dataset.name;

            preview += `
                <div class="card p-3 mb-3 shadow-sm">

                    <h5 class="text-primary">
                        ${title}
                    </h5>

                    <p class="mb-0">
                        <strong>${candidate}</strong>
                    </p>

                </div>
            `;
        }

    });

    preview += `
        <div class="alert alert-info mt-3">
            You can click <strong>Go Back</strong>
            to edit your choices before final submission.
        </div>
    `;

    document.getElementById(
        "previewContent"
    ).innerHTML = preview;

    let modal = new bootstrap.Modal(
        document.getElementById("previewModal")
    );

    modal.show();

    // =========================
    // RESTORE PORTFOLIOS
    // =========================
    document.querySelectorAll(
        '.portfolio-section'
    ).forEach(section => {

        section.style.display = "block";

    });

    document.getElementById(
        "submitSection"
    ).style.display = "block";
}

</script>

{% endblock %}
